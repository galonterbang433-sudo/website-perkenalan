
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Perkenalan</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            color: white;
            text-align: center;
        }

        .container {
            padding: 50px 20px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        h1 {
            color: #38bdf8;
        }

        button {
            background: #38bdf8;
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>Halo, Selamat Datang!</h1>

            <p>Ini adalah website sederhana saya.</p>

            <h2>Perkenalan Diri</h2>

            <p>Nama: Nama Kamu</p>
            <p>Umur: Umur Kamu</p>
            <p>Asal Sekolah: Sekolah Kamu</p>
            <p>Hobi: Hobi Kamu</p>

            <button onclick="sapa()">Klik Saya</button>
        </div>
    </div>

    <script>
        function sapa() {
            alert("Halo! Terima kasih telah mengunjungi website saya!");
        }
    </script>

</body>
</html>
